<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dream the Muse — чат</title>
<style>
body{margin:0;background:#10101a;color:#f4f0ff;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #655782;border-radius:10px;background:#211b30;color:inherit}input,textarea{width:100%;margin:8px 0 16px}textarea{min-height:110px}button{cursor:pointer;margin:0 8px 8px 0}button:disabled{opacity:.5;cursor:wait}#log{white-space:pre-wrap;overflow-wrap:anywhere}article{padding:14px;margin:12px 0;background:#211b30;border-radius:12px}#status{color:#e7ca91;min-height:24px}small{color:#c9c2dc}
</style>
</head>
<body>
<main>
<h1>Dream the Muse</h1>
<p>Творческий чат</p>
<form id="chat">
<label for="access">Код доступа</label>
<input id="access" type="password" autocomplete="off" required aria-describedby="privacy">
<small id="privacy">Код не сохраняется в браузерном хранилище. Не вводите ключ OpenRouter.</small>
<section id="log" aria-label="Переписка" aria-live="polite"></section>
<label for="message">Сообщение</label>
<textarea id="message" maxlength="4000" required></textarea>
<button id="send" type="submit">Отправить</button>
<button id="reset" type="button">Новый разговор</button>
<p id="status" role="status"></p>
</form>
</main>
<script>
window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments);};
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<script type="module">
const form=document.querySelector('#chat');
const access=document.querySelector('#access');
const input=document.querySelector('#message');
const log=document.querySelector('#log');
const status=document.querySelector('#status');
const send=document.querySelector('#send');
const reset=document.querySelector('#reset');
let history=[];
function show(role,text){const item=document.createElement('article');const label=document.createElement('strong');label.textContent=role==='user'?'Вы':'Dream the Muse';const body=document.createElement('p');body.textContent=text;item.append(label,body);log.append(item);}
reset.addEventListener('click',()=>{history=[];log.replaceChildren();status.textContent='Новый разговор начат.';input.focus();});
form.addEventListener('submit',async(event)=>{
event.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;
const messages=[...history.slice(-16),{role:'user',content:text}];
if(messages.reduce((n,m)=>n+m.content.length,0)>20000){status.textContent='Диалог слишком длинный. Начните новый разговор.';return;}
send.disabled=true;reset.disabled=true;status.textContent='Ожидаем ответ…';
try{
const response=await fetch('/api/chat',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json','X-Chat-Access':access.value},body:JSON.stringify({messages}),signal:AbortSignal.timeout(65000)});
const raw=await response.text();let data;
try{data=JSON.parse(raw);}catch{throw new Error(`Сервер вернул не JSON (HTTP ${response.status}). Проверьте развёртывание API.`);}
if(!response.ok)throw new Error(typeof data.error==='string'?data.error:`Ошибка HTTP ${response.status}`);
if(typeof data.reply!=='string'||!data.reply.trim())throw new Error('Сервер не вернул текст ответа.');
show('user',text);show('assistant',data.reply);history=[...messages,{role:'assistant',content:data.reply}];input.value='';status.textContent=data.incomplete?'Ответ сокращён из-за лимита длины.':'';
}catch(error){status.textContent=error.name==='TimeoutError'?'Время ожидания истекло. Повторите попытку.':error.message||'Не удалось связаться с API.';}
finally{send.disabled=false;reset.disabled=false;}
});
</script>
</body>
</html>
